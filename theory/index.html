<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Теория · Гриф и ноты</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Manrope:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../" data-section="theory">
  <main class="page narrow">
    <h1>Теория</h1>
    <p class="lead">Уроки идут по порядку: каждый опирается на предыдущий. Один урок — минут 10.</p>
    <div class="list" id="lessonList"></div>
  </main>

  <script src="../js/core.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    $('#lessonList').innerHTML = LESSONS.map((l, i) => `
      <a class="list-item${store.visited[l.slug] ? ' done' : ''}" href="${l.slug}.html">
        <span class="list-num">${store.visited[l.slug] ? '✓' : i + 1}</span>
        <div><h3>${l.title}</h3><p>${l.desc}</p></div>
        <span class="arrow">→</span>
      </a>`).join('');
  </script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Найди на грифе · Гриф и ноты</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rubik:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../" data-section="games" data-game="find-note">
  <main class="page">
    <div class="crumbs"><a href="index.html">Игры</a></div>
    <div class="game-head">
      <h1>Найди на грифе</h1>
      <div class="stats" id="stats"></div>
    </div>

    <details class="settings">
      <summary>⚙ Настройки</summary>
      <div class="settings-body">
        <label class="setting">Лады
          <div class="seg" data-key="maxFret" data-num><button data-val="4">0–4</button><button data-val="7">0–7</button><button data-val="12">0–12</button></div>
        </label>
        <button class="toggle" data-key="natural">Только без диезов</button>
        <button class="toggle" data-key="heat">Карта ошибок</button>
      </div>
    </details>

    <div class="mastery" id="mastery"></div>

    <section class="stage" id="play">
      <div class="prompt">
        <div><span class="question" id="question"></span><span class="question-sub" id="where"></span></div>
      </div>
      <div class="scroll-x" id="board"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>
    <section class="stage credits" id="results" hidden></section>

    <div class="game-foot">
      <span>Карта ошибок (в настройках) общая с игрой «Угадай ноту» и показывает слабые места.</span>
      <button id="reset">Сбросить прогресс игры</button>
    </div>
  </main>

  <script src="../js/core.js"></script>
  <script src="../js/posters.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/fretboard.js"></script>
  <script src="../js/game.js"></script>
  <script>
    const game = { pos: null, done: false, ok: false, clicked: null, warn: '', ms: null };

    const session = new Session({
      gameId: 'find-note',
      hud: $('#stats'), stage: $('#play'), resultsEl: $('#results'), progressEl: $('#mastery'),
      levels: FRET_LEVELS,
      onQuestion(focus) {
        game.pos = nextFretPosition(game.pos, focus);
        Object.assign(game, { done: false, ok: false, clicked: null, warn: '', ms: null });
        render();
        session.ask();
      },
    });

    function render() {
      const g = game.pos;
      $('#question').innerHTML = `Найди <mark>${pcName(g.pc)}</mark>${alt(altPcName(g.pc))}`;
      $('#where').textContent = `на ${g.s + 1}-й струне` + (settings.maxFret < 12 ? `, лады 0–${settings.maxFret}` : '');

      const marks = [];
      if (game.done) {
        for (let f = 0; f <= settings.maxFret; f++) {
          if ((OPEN_STRINGS[g.s] + f) % 12 === g.pc) marks.push({ s: g.s, f, text: pcName(g.pc), kind: 'ok' });
        }
        if (!game.ok) marks.push({ ...game.clicked, text: pcName(game.clicked.pc), kind: 'bad' });
      }
      $('#board').innerHTML = drawFretboard({ marks, maxFret: settings.maxFret, activeString: g.s, heat: settings.heat, clickable: !game.done });

      const fb = $('#feedback');
      if (!game.done) fb.innerHTML = `<span class="hint">${game.warn || 'Нажми лад на подсвеченной струне. Чем быстрее — тем больше очков.'}</span>`;
      else if (game.ok) fb.innerHTML = verdictHtml(true, `${pcName(g.pc)}${alt(altPcName(g.pc))} на ${g.s + 1}-й струне — все места отмечены.`, false, game.ms);
      else fb.innerHTML = verdictHtml(false,
        `Там ${pcName(game.clicked.pc)}${alt(altPcName(game.clicked.pc))}. Нужная нота отмечена зелёным.<br><span class="path">${countPath(g.s, g.f)}</span>`, true, game.ms);
    }

    function clickFret(s, f) {
      if (game.done) return;
      const g = game.pos;
      pluck(OPEN_STRINGS[s] + f);
      if (s !== g.s) {
        game.warn = `Это ${stringName(s)}. Нужна ${g.s + 1}-я — она подсвечена.`;
        render();
        return;
      }
      const pc = (OPEN_STRINGS[s] + f) % 12;
      Object.assign(game, { done: true, ok: pc === g.pc, clicked: { s, f, pc } });
      recordResult(store.fret, fretKey(g), game.ok);
      game.ms = session.record({
        key: fretKey(g), ok: game.ok, given: `${pcName(pc)}, ${f === 0 ? 'открытая' : f + ' лад'}`,
        label: `${pcName(g.pc)} · ${g.s + 1}-я струна`,
      }).ms;
      render();
      if (game.ok) { const token = g; setTimeout(() => { if (game.pos === token) session.next(); }, 900); }
    }

    $('#play').addEventListener('click', e => {
      const cell = e.target.closest('.cell');
      if (cell) clickFret(Number(cell.dataset.s), Number(cell.dataset.f));
      if (e.target.closest('[data-next]')) session.next();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && game.done && !game.ok && !session.finished && !e.target.closest('button')) session.next();
    });
    document.addEventListener('settingschange', e => {
      if (['maxFret', 'natural'].includes(e.detail.key)) session.start();
      else if (!$('#play').hidden) render();
    });
    bindControls($('.settings'));
    bindReset($('#reset'), () => { store.fret = {}; session.resetProgress(); });
    session.start();
  </script>
</body>
</html>

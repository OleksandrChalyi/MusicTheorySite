<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Угадай ноту · Гриф и ноты</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rubik:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../css/style.css?v=202611092042">
</head>
<body data-root="../" data-section="games" data-game="guess-note">
  <main class="page">
    <div class="crumbs"><a href="index.html">Игры</a></div>
    <div class="game-head">
      <h1>Угадай ноту</h1>
      <div class="stats" id="stats"></div>
    </div>

    <section class="stage" id="play">
      <div class="prompt">
        <div><span class="question">Какая это нота?</span><span class="question-sub" id="where"></span></div>
        <button class="ghost-btn" id="replay">▶ Звук</button>
      </div>
      <div class="scroll-x" id="board"></div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>
    <section class="stage credits" id="results" hidden></section>

    <div class="mastery" id="mastery"></div>
    <details class="settings">
      <summary>⚙ Настройки</summary>
      <div class="settings-body">
        <label class="setting">Лады
          <div class="seg" data-key="maxFret" data-num><button data-val="4">0–4</button><button data-val="7">0–7</button><button data-val="12">0–12</button></div>
        </label>
        <button class="toggle" data-key="natural">Только без диезов</button>
        <button class="toggle" data-key="heat">Карта ошибок</button>
      </div>
    </details>

    <div class="game-foot">
      <span>Ноты, в которых ошибаешься, выпадают чаще. Не помнишь правила — <a href="../theory/fretboard.html">урок «Ноты на грифе»</a>.</span>
      <button id="reset">Сбросить прогресс игры</button>
    </div>
  </main>

  <script src="../js/core.js?v=202611092042"></script>
  <script src="../js/posters.js?v=202611092042"></script>
  <script src="../js/layout.js?v=202611092042"></script>
  <script src="../js/fretboard.js?v=202611092042"></script>
  <script src="../js/game.js?v=202611092042"></script>
  <script>
    const game = { pos: null, done: false, ok: false, picked: null, rec: null };

    const session = new Session({
      gameId: 'guess-note',
      hud: $('#stats'), stage: $('#play'), resultsEl: $('#results'), progressEl: $('#mastery'),
      levels: FRET_LEVELS,
      onQuestion(focus) {
        game.pos = nextFretPosition(game.pos, focus);
        Object.assign(game, { done: false, ok: false, picked: null, rec: null });
        render();
        pluck(OPEN_STRINGS[game.pos.s] + game.pos.f);
        session.ask(fretKey(game.pos));
      },
    });

    function render() {
      const g = game.pos;
      $('#where').textContent = `${stringName(g.s)}, ${fretName(g.f)}`;
      const mark = game.done
        ? { s: g.s, f: g.f, text: pcName(g.pc), kind: game.ok ? 'ok' : 'bad' }
        : { s: g.s, f: g.f, text: '?', kind: 'target' };
      $('#board').innerHTML = drawFretboard({ marks: [mark], maxFret: settings.maxFret, heat: settings.heat, crop: true });

      const pcs = settings.natural ? NATURAL_PCS : [...Array(12).keys()];
      const options = pcs.map(pc => ({ value: pc, label: pcName(pc), alt: altPcName(pc), sharp: !NATURAL_PCS.includes(pc) }));
      $('#answers').innerHTML = answerButtons(options, game.done ? { correct: g.pc, picked: game.picked } : null);

      const fb = $('#feedback');
      if (!game.done) fb.innerHTML = '<span class="hint">Выбери ноту ниже. Чем быстрее — тем больше очков.</span>';
      else if (game.ok) fb.innerHTML = verdictHtml(true, `${stringName(g.s)}, ${fretName(g.f)} — ${pcName(g.pc)}${alt(altPcName(g.pc))}.`, false, game.rec);
      else fb.innerHTML = verdictHtml(false,
        `Это <b>${pcName(g.pc)}</b>${alt(altPcName(g.pc))}, а не ${pcName(game.picked)}.<br><span class="path">${countPath(g.s, g.f)}</span>`, true, game.rec);
    }

    function answer(pc) {
      if (game.done) return;
      const g = game.pos;
      Object.assign(game, { done: true, picked: pc, ok: pc === g.pc });
      recordResult(store.fret, fretKey(g), game.ok);
      game.rec = session.record({
        key: fretKey(g), name: pcName(g.pc), ok: game.ok, given: pcName(pc),
        label: `${pcName(g.pc)} · ${g.s + 1}-я стр., ${g.f === 0 ? 'открытая' : g.f + ' лад'}`,
      });
      pluck(OPEN_STRINGS[g.s] + g.f);
      render();
      if (game.ok) { const token = g; setTimeout(() => { if (game.pos === token) session.next(); }, 800); }
    }

    $('#play').addEventListener('click', e => {
      const btn = e.target.closest('[data-answer]');
      if (btn) answer(Number(btn.dataset.answer));
      if (e.target.closest('[data-next]')) session.next();
    });
    $('#replay').addEventListener('click', () => pluck(OPEN_STRINGS[game.pos.s] + game.pos.f));
    document.addEventListener('settingschange', e => {
      if (['maxFret', 'natural'].includes(e.detail.key)) session.start();
      else if (!$('#play').hidden) render();
    });
    bindControls($('.settings'));
    bindReset($('#reset'), () => { store.fret = {}; session.resetProgress(); });
    session.start();
  </script>
</body>
</html>
